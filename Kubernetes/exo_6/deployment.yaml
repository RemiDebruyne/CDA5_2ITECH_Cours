apiVersion: apps/v1
kind: Deployment

metadata:
  name: exo-6-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginxip
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 3
  template:
    metadata:
      name: exo-6-pod
      labels:
        app: nginxip
    spec:
      containers:
        - name: exo-6-container
          image: remidebruyne/nginxip
          resources:
            requests:
              memory: '64Mi'
              cpu: '100m'
            limits:
              memory: '128Mi'
              cpu: '200m'
