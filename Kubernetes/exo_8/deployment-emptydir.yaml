apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-emptydir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-emptydir
  template:
    metadata:
      labels:
        app: api-emptydir
    spec:
      containers:
        - name: api
          image: remidebruyne/api-python
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}